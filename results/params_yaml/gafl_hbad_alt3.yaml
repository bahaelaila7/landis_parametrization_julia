# Pan succession parameter set — plugin: hbad (format 1). Full roster; edit values, keep structure.
# global.SUFFICIENT_LIGHT[shade_class+1][shade_tolerance]: establishment light factor, site shade class 0..5 × species
# shade tolerance 1..5 (corner = most tolerant species under the deepest shade = 0.5).
# species_map: FIA species symbol → parameter species; eco_mapping: (EPA L3, FIA site class) → eco cell.
pan_params:
  plugin: "hbad"
  format_version: 1
  name: "GA+FL HBAD alternative 3"
  description: "Distinct behavioural alternative to GA+FL HBAD v1 from anchor-and-explore (gdigel mode explore, train split; docs/cmaes_gdigel.md §4): no species group outside its bias tolerance on train, parameters far from v1 — use it with v1 to bracket projection uncertainty. Held-out scores: results/explore_hbad/heldout_*.csv."
  created: "2026-10-14"
  region:
    states: [12, 13]
    eco_cells: ["15.4.1|lu=X", "8.3.4|lu=A", "8.3.4|lu=B", "8.3.4|lu=C", "8.3.4|lu=D", "8.3.5|lu=A", "8.3.5|lu=B", "8.3.5|lu=C", "8.3.5|lu=D", "8.4.1|lu=X", "8.4.4|lu=X", "8.4.9|lu=X", "8.5.3|lu=A", "8.5.3|lu=B", "8.5.3|lu=C", "8.5.3|lu=D"]
    l3: ["8.3.5", "8.3.4", "8.5.3", "8.4.4", "8.4.9", "8.4.1", "15.4.1"]
  provenance:
    method: "gdigel explore + farthest-point selection"
    training_config: "/workspace/landis_scen/configs/region4/gafl_hbad.yml"
    source_jld2: "/workspace/landis_scen/runs_local/explore_hbad/distinct/alt_3.jld2"
    selection_row: "3,alt_3.jld2,solution L9 g60,0,10,34,47,0.3,0.3,G_MULT 11.6%; M_MULT 27.8%; SDIMAX 15.4%"
eco_mapping:
  fallback: "exact cell → 'NA' cell → the L3's most common cell (scenario runner)"
  field: "epa_l3"
  site_class_from: "COND.SITECLCD of the dominant forested condition (max CONDPROP_UNADJ, COND_STATUS_CD = 1)"
  site_class_cells:
    D: [6, 7]
    B: [4]
    A: [1, 2, 3]
    C: [5]
  cell_l3s: ["8.3.5", "8.3.4", "8.5.3"]
  missing_cell: "NA"
  other_cell: "X"
