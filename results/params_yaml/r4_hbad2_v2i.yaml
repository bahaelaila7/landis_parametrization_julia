  region:
    states: [1, 12, 13, 21, 28, 37, 45, 47]
    eco_cells: ["15.4.1|lu=X", "8.3.2|lu=X", "8.3.3|lu=X", "8.3.4|lu=A", "8.3.4|lu=B", "8.3.4|lu=C", "8.3.4|lu=D", "8.3.5|lu=A", "8.3.5|lu=B", "8.3.5|lu=C", "8.3.5|lu=D", "8.3.6|lu=A", "8.3.6|lu=B", "8.3.6|lu=C", "8.3.6|lu=D", "8.4.1|lu=X", "8.4.2|lu=X", "8.4.3|lu=X", "8.4.4|lu=X", "8.4.9|lu=X", "8.5.1|lu=A", "8.5.1|lu=B", "8.5.1|lu=C", "8.5.1|lu=D", "8.5.2|lu=X", "8.5.3|lu=A", "8.5.3|lu=B", "8.5.3|lu=C", "8.5.3|lu=D"]
