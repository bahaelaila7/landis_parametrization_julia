# Pan succession parameter set - plugin: hbad2 (HBAD v2; format 1). Parameters are per species KEY (10 own species + the pooled _S / _H groups).
# species_map: FIA species symbol -> key; eco_mapping: (EPA L3, FIA site class) -> eco cell (the parameters do not depend on the cell).
pan_params:
  plugin: "hbad2"
  format_version: 1
  name: "Region 4 hbad2 v2i"
  description: "HBAD v2 (model v2i = joint fit j14: as v2h plus a fitted global recruitment level kappa 0.579 on the data-fitted recruitment; mortality frozen at the Sim A optimum v2f; results/hbad2/v2i): per-species-key parameters, no ecoregion dependence. Eco cells and eco_mapping of r4_hbad_v1."
