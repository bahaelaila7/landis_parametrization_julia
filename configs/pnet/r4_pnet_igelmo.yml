# EPA Region 4 × 14 L3 ecoregions — Igel MO-CMA-ES, PnET (succession_plugin: pnet). Same data/split/train cap as
# configs/region4/r4_igelmo_full.yml so the two models are directly comparable.
# Species-balanced training (train_cap), L3→L2→region pooling of growth params, per-L3 CMA-ES blocks.
# (BiomassSuccession config note, not needed for PnET) TWO-PASS: (1) run with `split_only: true` (override) → output_dir gets split_plots.csv/species_map.csv/pool_map.csv;
#           (2) tools/build_floors_region.jl --run <that dir> --db ${PAN_DATA}/slim_r4.duckdb --out ${PAN_DATA}/floor_r4
#               → floor_r4_bmax.csv / floor_r4_anpp.csv (from TRAIN plots only); (3) run this config normally.
seed: 1337
cohorts_db_path: "${PAN_DATA}/slim_r4.duckdb"      # tools/build_slim_db_region.jl (state ∩ L3, + PLOT)
tablename: "curated_cohorts_landis_stdorg"
output_dir: "${PAN_OUT}/r4_pnet_igelmo_outputs"
succession_plugin: "pnet"
pnet_climate_cache: "${PAN_DATA}/pnet_climate_r4_l4.jld2"   # tools/build_pnet_climate.jl (PRISM L4, 1980–2025)
pnet_co2_csv: "${PAN_DATA}/co2_annual.csv"                  # NOAA Mauna Loa annual means
pnet_soil_csv: "${PAN_DATA}/plot_soil_r4.csv"                # per-plot SOLUS soil hydraulics (tools/build_plot_soil.jl); omit => per-L3 texture (LOAM)
filter_eco_field: "epa_l3"
filter_ecos: ["8.3.5", "8.5.3", "8.3.4", "8.3.3", "8.5.1", "8.3.6", "8.4.1", "8.4.9", "8.4.4", "8.5.2", "15.4.1", "8.4.2", "8.3.2", "8.4.3"]
filter_states: [1, 12, 13, 21, 28, 37, 45, 47]
eco_field: "epa_l3"
single_ecoregion: false
stratify_landuse: true
site_class_strata: true
siteclass_scheme: "4cell"
siteclass_l3s: ["8.3.5", "8.3.4", "8.5.3", "8.5.1", "8.3.6"]   # pine L3s (inventory: 36–57 % pine-dominated); others one cell "X"
shade_tier_csv: "${PAN_DATA}/shadetol_all_species_ext.csv"
max_exact: 30
max_group: 8
min_trees: 100
min_agb_frac: 0.005        # region-wide: 0.02 admits only ~11 species with ~197 present — TUNE from the split_only species table
skip_disturbances: false
spinup: false
override_injection: true
override_injection_sync: true
override_injection_disturbance: "exclude_overwrite"
no_establishment: true
search_mode: "igelmo"
tier: 3
dual_mode: false
trials: 1000000
igel_mu: 70
igel_sigma0: 0.3
igel_reseed_sigma: 0.03
igel_reseed_random_frac: 0.5
igel_maturity: 30
igel_seed_maturity: true
igel_sobol_init: true
igel_sobol_pool_k: 5
igel_sobol_raw_mult: 2
cmaes_archive_cap: 1000
cmaes_single_cov: false
cmaes_blocks: "l3"          # one block per (param group, L3) + tail; A/B vs single_cov on the smoke before production
igel_cholesky: true
train_cap: "auto"
train_cap_k: 4.0         # softer all-species leveling (user choice 2026-10-12): cap ≈ 4× median stratum per eco cell
train_cap_min: 20
param_pooling:
  min_plots: 150
  floor_pooled: max
  params:
    FolN: {level: l3, fallback: [l2, region], cell_split: [PITA, PIEL]}   # PnET productivity knob, poolable like B_MAX
  cell_merge: {PIEL: {A: AB, B: AB}}
rankw_mode: "cbal_pct"
rankw_beta: 0.999
rankw_pct_floor: 0.1
bmax_floor_from_data: false   # BiomassSuccession-only (no B_MAX/ANPP in PnET)
anpp_floor_from_data: false
n_folds: 1
val_frac: 0.25
test_frac: 0.25
split_seed: 42
fia_cycle: true
fia_cycle_merge: 3
bins_idx: [10, 20, 30, 40, 50, 60, 80, 100, 120, 150]
smoothing_window_size: 1
smoothing_variance: 0.49
n_reps: 3
init_perturb_frac: 0.05
longevity_from_data: true
longevity_overrides: {PIEL: 275}
cycle_years: 8
agb_hinge: true
agb_hinge_pct: 0.05
agb_hinge_pct_min: 2.0
agb_hinge_pct_max: 10.0
agb_hinge_p: 1.0
agb_hinge_beta: 0.1
agb_normalize: true
w_normalize: true
cell_normalize: true
w_scale_factor: 0.01
w_p: 1.0
loss_piecewise: false
unbinned_w: true
w_count_balance: true
w_count_balance_mode: "both"
w_count_beta: 0.99
w_count_pct_floor: 0.1
w_smooth: true
w_smooth_auto_knee: false
w_smooth_beta: 1.0
w_smooth_band: 0.05
w_hinge: true
w_hinge_pct: 0.01
w_hinge_pct_min: 2.0
w_hinge_pct_max: 5.0
dominance_species: "all"
