# PnET SMOKE + per-plot SOLUS soil (8.5.3 coastal plain): plumbing check for succession_plugin: pnet (PnET ecophysiology, spec docs/pnet_spec.md).
# Derived from configs/region4/r4_smoke_2l3.yml. B_MAX/ANPP/S do not exist in PnET: FolN is the pooled EcoSpecies parameter.
# Needs PAN_DATA (slim DB + PRISM climate cache + CO2 csv) and PAN_OUT.
seed: 1337
succession_plugin: "pnet"
pnet_climate_cache: "${PAN_DATA}/pnet_climate_r4_l4.jld2"
pnet_co2_csv: "${PAN_DATA}/co2_annual.csv"
pnet_soil_csv: "${PAN_DATA}/plot_soil_r4.csv"   # per-plot SOLUS soil (tools/build_plot_soil.jl)
# pnet_generic: {precip_events: 11}          # optional PnETConst overrides
# pnet_soil_texture: {"8.5.3": "SALO"}       # optional {L3: Saxton-Rawls texture}; default LOAM
cohorts_db_path: "${PAN_DATA}/slim_r4.duckdb"
tablename: "curated_cohorts_landis_stdorg"
output_dir: "${PAN_OUT}/pnet_smoke_853_solus_outputs"
filter_eco_field: "epa_l3"
filter_ecos: ["8.5.3"]
filter_states: [1, 12, 13, 21, 28, 37, 45, 47]   # EPA Region 4 (AL FL GA KY MS NC SC TN)
eco_field: "epa_l3"
single_ecoregion: false
stratify_landuse: true
site_class_strata: true
siteclass_scheme: "4cell"
siteclass_l3s: ["8.5.3"]
shade_tier_csv: "${PAN_DATA}/shadetol_all_species_ext.csv"
max_exact: 30
max_group: 8
min_trees: 100
min_agb_frac: 0.02
skip_disturbances: false
spinup: false
override_injection: true
override_injection_sync: true
override_injection_disturbance: "exclude_overwrite"
no_establishment: true
search_mode: "igelmo"
tier: 3
dual_mode: false
trials: 20
igel_mu: 10
igel_sigma0: 0.3
igel_sobol_init: false
cmaes_archive_cap: 200
cmaes_single_cov: false
cmaes_blocks: "l3"
igel_cholesky: true
train_cap: "auto"          # species-balanced TRAIN: cap per (eco cell × dominant species); surplus → val/test
train_cap_k: 1.5
train_cap_min: 20
param_pooling:
  min_plots: 40
  floor_pooled: max
  params:
    FolN: {level: l3, fallback: [l2, region], cell_split: [PITA, PIEL]}
  cell_merge: {PIEL: {A: AB, B: AB}}
rankw_mode: "cbal_pct"
rankw_beta: 0.999
rankw_pct_floor: 0.1
bmax_floor_from_data: false
anpp_floor_from_data: false
n_folds: 1
val_frac: 0.25
test_frac: 0.25
split_seed: 42
fia_cycle: true
fia_cycle_merge: 3
bins_idx: [10, 20, 30, 40, 50, 60, 80, 100, 120, 150]
smoothing_window_size: 1
smoothing_variance: 0.49
n_reps: 1
init_perturb_frac: 0.05
longevity_from_data: true
longevity_overrides: {PIEL: 275}
cycle_years: 8
agb_hinge: true
agb_hinge_pct: 0.05
agb_hinge_pct_min: 2.0
agb_hinge_pct_max: 10.0
agb_hinge_p: 1.0
agb_hinge_beta: 0.1
agb_normalize: true
w_normalize: true
cell_normalize: true
w_scale_factor: 0.01
w_p: 1.0
loss_piecewise: false
unbinned_w: true
w_count_balance: true
w_count_balance_mode: "both"
w_count_beta: 0.99
w_count_pct_floor: 0.1
w_smooth: true
w_smooth_auto_knee: false
w_smooth_beta: 1.0
w_smooth_band: 0.05
w_hinge: true
w_hinge_pct: 0.01
w_hinge_pct_min: 2.0
w_hinge_pct_max: 5.0
dominance_species: "all"
